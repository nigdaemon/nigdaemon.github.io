baseURL = "https://nigdaemon.github.io/"
title = "XT Weblog"
defaultContentLanguage = "zh-cn"
enableRobotsTXT = true
summaryLength = 42


[params]
  author = "XT"
  description = "XT的网络日志"
  dateformat = "2006-01-02"

  [params.logo]
    logoMark = ">"
    logoText = "XT Weblog"
    logoHomeLink = "/"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "about"
    url = "/about/"
    weight = 2
