baseURL = "https://nigdaemon.github.io/"
title = "XT Weblog"
defaultContentLanguage = "zh-cn"
enableRobotsTXT = true
summaryLength = 42
theme = "smigle-hugo-theme"


[params]
  author = "XT"
  mainSections = ["posts"]
  description = "XT的网络日志"
  subtitle = "XT的网络日志"
  dateformat = "2006-01-02"
  dateFmt = "2006-01-02"
  abbrDateFmt = "01-02"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 2

  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 3

  [[menu.main]]
    identifier = "rss"
    name = "RSS"
    url = "/index.xml"
    weight = 4
