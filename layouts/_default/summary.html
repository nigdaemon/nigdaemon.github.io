<article class="summary">
  <a href="{{ .Permalink }}">
    <h1 class="title">{{ .Title }}</h1>
    {{ with .Params.subtitle }}<h3 class="subtitle">{{ . }}</h3>{{ end }}
  </a>
  {{ partial "postMeta.html" . }}
  <div class="content">
    <p>{{ .Summary | plainify | truncate 180 }}</p>
    <a href="{{ .Permalink }}">阅读全文...</a>
  </div>
</article>
