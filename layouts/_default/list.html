{{ define "main" }}
  <section class="page-title">
    <h1>{{ .Title }}</h1>
  </section>

  <section class="post-list">
    {{ range .Pages.ByWeight }}
      <article class="post-row">
        <a href="{{ .RelPermalink }}">
          <span class="post-title">{{ .Title }}</span>
          {{ with .Summary }}
            <span class="post-summary">{{ . | plainify | truncate 120 }}</span>
          {{ end }}
        </a>
      </article>
    {{ end }}
  </section>
{{ end }}
