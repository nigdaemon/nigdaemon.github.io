<!doctype html>
<html lang="{{ site.LanguageCode | default site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.Params.description }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
    {{ with .OutputFormats.Get "RSS" }}
      <link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">
    {{ end }}
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
        <nav class="nav" aria-label="Main navigation">
          {{ range site.Menus.main }}
            <a href="{{ .URL | relURL }}">{{ .Name }}</a>
          {{ end }}
        </nav>
      </div>
    </header>
    <main class="wrap main">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="wrap footer">
      <span>{{ site.Params.description }}</span>
    </footer>
  </body>
</html>
