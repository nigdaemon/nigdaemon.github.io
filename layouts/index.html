{{ define "main" }}
  <section class="intro">
    <p class="eyebrow">Personal weblog</p>
    <h1>{{ site.Title }}</h1>
    <p>{{ site.Params.description }}</p>
  </section>

  {{ $posts := where site.RegularPages "Section" "posts" }}
  <section class="post-list" aria-labelledby="posts-title">
    <div class="section-heading">
      <h2 id="posts-title">文章</h2>
      <span>{{ len $posts }} 篇</span>
    </div>
    {{ range $posts.ByWeight }}
      <article class="post-row">
        <a href="{{ .RelPermalink }}">
          <span class="post-title">{{ .Title }}</span>
          {{ with .Summary }}
            <span class="post-summary">{{ . | plainify | truncate 120 }}</span>
          {{ end }}
        </a>
      </article>
    {{ end }}
  </section>
{{ end }}
